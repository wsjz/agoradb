[workspace]
members = ["crates/*", "tests", "tests/tools/data-gen"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["The AgoraDB Authors"]

[workspace.dependencies]
# Async runtime and utilities
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
async-trait = "0.1"
futures = "0.3"

# Errors, serialization, misc
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
bytes = "1"
bitflags = "2"
tracing = "0.1"

# Arrow / Parquet / Iceberg — all pinned to the arrow 58 line.
arrow = "58"
arrow-array = "58"
arrow-schema = "58"
arrow-select = "58"
arrow-ipc = "58"
arrow-cast = { version = "58", features = ["prettyprint"] }
parquet = { version = "58", features = ["arrow", "zstd"] }
iceberg = "0.10.1"

# Federation coordinator (DataFusion 54 == arrow 58). Do NOT bump to 55 (arrow 59).
datafusion = "54"
datafusion-federation = { version = "=0.5.5", features = ["sql"] }
sqlparser = { version = "0.62", features = ["visitor"] }

# Engines
# Prebuilt libduckdb via DUCKDB_DOWNLOAD_LIB (.cargo/config.toml); parquet is built in.
duckdb = { version = "=1.10505.0" }
rusqlite = { version = "0.40", features = ["bundled", "column_decltype"] }

# Identity and networking
ed25519-dalek = { version = "2.2", features = ["zeroize"] }
getrandom = "0.3"
base64 = "0.22"
bs58 = "0.5"
blake3 = "1.8"
zeroize = "1"
arrow-flight = "58.4"
tonic = "0.14"
clap = { version = "4", features = ["derive", "env"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Dev
tempfile = "3"
tokio-test = "0.4"
