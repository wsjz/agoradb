# Dependencies keep only line tables: backtraces stay readable, but DataFusion /
# Arrow no longer ship full debug info into every test binary.
[profile.dev.package."*"]
debug = "line-tables-only"

# Link the official prebuilt libduckdb (downloaded once into target/duckdb-download)
# instead of compiling DuckDB's C++ sources.
[env]
DUCKDB_DOWNLOAD_LIB = "1"

[build]
rustflags = ["-C", "symbol-mangling-version=v0"]

[alias]
sweep = "sweep --time 30"

check-tests = "test --no-run"
