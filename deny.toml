# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run with: cargo deny check licenses
#
# Policy (AGENT.md §3.2): permissive licenses only. GPL / LGPL / AGPL / SSPL,
# proprietary and "non-commercial" licenses are forbidden.

[graph]
all-features = true

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]

# libbzip2's own permissive, BSD-style license (keep notice, mark changes,
# no endorsement; no advertising clause). It reaches us only through
# DataFusion's default `compression` feature, which datafusion-federation
# enables and Cargo feature unification makes impossible to turn off. The
# federation coordinator never reads compressed files, so the code is linked
# but unused. Scoped to this one crate rather than allowed globally.
[[licenses.exceptions]]
crate = "libbz2-rs-sys"
allow = ["bzip2-1.0.6"]

# Workspace crates are Apache-2.0 but unpublished.
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
