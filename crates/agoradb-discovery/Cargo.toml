[package]
name = "agoradb-discovery"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "AgoraDB peer discovery on the local network (libp2p mDNS), recording each peer's Flight endpoint by DID"

[dependencies]
agoradb-catalog = { path = "../agoradb-catalog" }
agoradb-identity = { path = "../agoradb-identity" }
futures = { workspace = true }
libp2p = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
iceberg = { workspace = true }
tempfile = { workspace = true }
