[package]
name = "oikome-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Pluggable query-engine abstraction for Oikome"

[features]
# BlockingWorker: drive blocking drivers (DuckDB, SQLite) on tokio's
# blocking pool. Off in the browser build.
default = ["blocking"]
blocking = ["dep:tokio-stream", "tokio/rt"]

[dependencies]
oikome-core = { path = "../oikome-core" }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
async-trait = { workspace = true }
bitflags = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tokio-stream = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tokio-test = { workspace = true }
