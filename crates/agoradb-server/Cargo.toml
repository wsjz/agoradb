[package]
name = "agoradb-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "AgoraDB node server: the Arrow Flight endpoint peers query, and the agoradb binary"

[[bin]]
name = "agoradb"
path = "src/main.rs"

[dependencies]
agoradb-catalog = { path = "../agoradb-catalog" }
agoradb-core = { path = "../agoradb-core" }
agoradb-discovery = { path = "../agoradb-discovery" }
agoradb-engine = { path = "../agoradb-engine" }
agoradb-identity = { path = "../agoradb-identity" }
agoradb-network = { path = "../agoradb-network" }
agoradb-node = { path = "../agoradb-node" }
agoradb-semantic = { path = "../agoradb-semantic" }
arrow-cast = { workspace = true }
arrow-flight = { workspace = true }
arrow-ipc = { workspace = true }
arrow-schema = { workspace = true }
blake3 = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
iceberg = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
arrow-array = { workspace = true }
