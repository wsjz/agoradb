[package]
name = "agoradb-vfs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
agoradb-core = { path = "../agoradb-core" }
opendal = { version = "0.52", features = ["services-fs", "services-s3"] }
tokio = { workspace = true }
iceberg = "0.9"
serde = { version = "1", features = ["derive"] }
typetag = "0.2"
bytes = "1"
serde_json = "1"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
