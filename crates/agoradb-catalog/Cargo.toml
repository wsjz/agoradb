[package]
name = "agoradb-catalog"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
agoradb-core = { path = "../agoradb-core" }
agoradb-storage = { path = "../agoradb-storage" }
iceberg = "0.9"
tracing = "0.1"
tokio = { workspace = true }
async-trait = "0.1"
dashmap = "6"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { workspace = true }
arrow = "57"
arrow-array = "57"
parquet = { version = "57", features = ["arrow"] }
datafusion = { workspace = true }
datafusion-datasource = "51"
datafusion-common = "51"
datafusion-execution = "51"
datafusion-physical-plan = "51"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
agoradb-storage = { path = "../agoradb-storage" }
arrow-array = "57"
arrow-schema = "57"
