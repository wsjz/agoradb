[package]
name = "agoradb-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "AgoraDB browser node: the Rust core as WebAssembly, with duckdb-wasm provided by the JavaScript host"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
agoradb-core = { path = "../agoradb-core" }
agoradb-engine = { path = "../agoradb-engine", default-features = false }
agoradb-identity = { path = "../agoradb-identity", default-features = false }
agoradb-semantic = { path = "../agoradb-semantic" }
arrow-array = { workspace = true }
arrow-ipc = { workspace = true }
arrow-schema = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlparser = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }

[dev-dependencies]
# Native tests stand in for duckdb-wasm with the native DuckDB engine.
agoradb-engine-duckdb = { path = "../agoradb-engine-duckdb" }
tokio = { workspace = true, features = ["full"] }
