[package]
name = "agoradb-node"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "AgoraDB node runtime: session, engine registry and statement routing"

[features]
default = ["engine-duckdb", "engine-sqlite"]
engine-duckdb = ["dep:agoradb-engine-duckdb"]
engine-sqlite = ["dep:agoradb-engine-sqlite"]

[dependencies]
agoradb-core = { path = "../agoradb-core" }
agoradb-catalog = { path = "../agoradb-catalog" }
agoradb-engine = { path = "../agoradb-engine" }
agoradb-engine-duckdb = { path = "../agoradb-engine-duckdb", optional = true }
agoradb-engine-sqlite = { path = "../agoradb-engine-sqlite", optional = true }
agoradb-federation = { path = "../agoradb-federation" }
agoradb-semantic = { path = "../agoradb-semantic" }
agoradb-storage = { path = "../agoradb-storage" }
arrow-array = { workspace = true }
arrow-cast = { workspace = true }
arrow-schema = { workspace = true }
arrow-select = { workspace = true }
futures = { workspace = true }
iceberg = { workspace = true }
sqlparser = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
