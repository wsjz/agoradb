# Network phase (3.1) end to end: three Oikome nodes in Docker
# (docker/compose.yml), driven by tests/e2e/docker_nodes.sh.
name: docker-e2e

on:
  push:
    branches: ["main", "feat/**", "ci/**"]
  # Pull requests from forks, which do not push to this repository.
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  three-nodes:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Build the node image
        run: docker compose -f docker/compose.yml build

      - name: Discovery, TLS, federated query, subscription, revocation, Lance search
        run: bash tests/e2e/docker_nodes.sh
        env:
          E2E_BUILD: "0"
          E2E_LOG_DIR: e2e-logs

      - name: Upload node logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: e2e-logs/
