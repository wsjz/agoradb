# Browser node (3.2): crates/agoradb-wasm built to WebAssembly, run in
# headless Chromium with duckdb-wasm by the Playwright tests in web/tests.
name: browser-e2e

on:
  push:
    branches: ["feat/**", "ci/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-node:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust target and tools for WebAssembly
        run: |
          rustup target add wasm32-unknown-unknown
          # The CLI must match the wasm-bindgen crate version (Cargo.toml).
          cargo install wasm-bindgen-cli --version 0.2.108 --locked
          # DataFusion compiles zstd (C) for wasm32: clang and llvm-ar.
          sudo apt-get update && sudo apt-get install -y --no-install-recommends clang llvm

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build the browser node
        working-directory: web
        env:
          CC_wasm32_unknown_unknown: clang
          AR_wasm32_unknown_unknown: llvm-ar
        run: bash scripts/build.sh

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        working-directory: web
        env:
          CI: "1"
        run: npx playwright test

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
