# Browser node (3.2): crates/oikome-wasm built to WebAssembly, run in
# headless Chromium with duckdb-wasm by the Playwright tests in e2e/,
# against a Full Node (the native oikome binary) for the WebRTC tests.
name: browser-e2e

on:
  push:
    branches: ["main", "feat/**", "ci/**"]
  # Pull requests from forks, which do not push to this repository.
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-node:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust target and tools for WebAssembly
        run: |
          rustup target add wasm32-unknown-unknown
          # The CLI must match the wasm-bindgen crate version (Cargo.toml).
          cargo install wasm-bindgen-cli --version 0.2.108 --locked
          # DataFusion compiles zstd (C) for wasm32: clang and llvm-ar.
          sudo apt-get update && sudo apt-get install -y --no-install-recommends clang llvm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build the browser node and the test page
        env:
          CC_wasm32_unknown_unknown: clang
          AR_wasm32_unknown_unknown: llvm-ar
        run: npm run build

      - name: Build the Full Node
        run: cargo build --locked -p oikome-server --bin oikome

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        working-directory: e2e
        env:
          CI: "1"
        run: npx playwright test

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
