# Three AgoraDB nodes on one bridge network, for the 3.1 end-to-end check
# (tests/e2e/docker_nodes.sh). All serve Arrow Flight over TLS.
#
#   node-a  owns the data
#   node-b  reads it; dials node-a's libp2p address, so discovery does not
#           depend on multicast
#   node-c  finds node-a by mDNS only
#
#   docker compose -f docker/compose.yml build
#   bash tests/e2e/docker_nodes.sh

name: agoradb-e2e

# Built once (by node-a); the other nodes run the same local image.
x-node: &node
  image: agoradb:e2e
  pull_policy: never

services:
  node-a:
    <<: *node
    build:
      context: ..
      dockerfile: docker/agoradb.Dockerfile
    command: ["serve", "--listen", "0.0.0.0:50051", "--p2p-listen", "/ip4/0.0.0.0/tcp/4001"]
    volumes: ["a-data:/data"]
    networks:
      agora:
        ipv4_address: 172.28.0.10

  node-b:
    <<: *node
    command: ["serve", "--listen", "0.0.0.0:50051", "--p2p-listen", "/ip4/0.0.0.0/tcp/4001",
              "--dial", "/ip4/172.28.0.10/tcp/4001"]
    volumes: ["b-data:/data"]
    networks:
      agora:
        ipv4_address: 172.28.0.11

  node-c:
    <<: *node
    command: ["serve", "--listen", "0.0.0.0:50051", "--p2p-listen", "/ip4/0.0.0.0/tcp/4001"]
    volumes: ["c-data:/data"]
    networks:
      agora:
        ipv4_address: 172.28.0.12

networks:
  agora:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  a-data: {}
  b-data: {}
  c-data: {}
